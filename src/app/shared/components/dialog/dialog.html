<div class="backdrop" (click)="ui.close()"></div>
<section class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title()" [style.max-width.px]="width()">
  <header class="dialog__header">
    <h2>{{ title() }}</h2>
    <button type="button" class="dialog__close" [attr.aria-label]="'common.close' | translate" (click)="ui.close()">
      <fa-icon name="close" [size]="18" />
    </button>
  </header>
  <ng-content />
</section>
